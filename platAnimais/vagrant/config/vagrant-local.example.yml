# O seu token pessoal do GitHub
github_token: <your-personal-github-token>
# Read more: https://github.com/blog/1509-personal-api-tokens
# Pode gera-lo aqui: https://github.com/settings/tokens

# Fuso horario do sistema operativo convidado
timezone: Europe/London

# Devemos verificar atualizacoes da box em cada 'vagrant up'?
box_check_update: false

# Nome da maquina virtual
machine_name: y2aa

# IP da maquina virtual
ip: 192.168.83.137

# Numero de nucleos de CPU da maquina virtual
cpus: 1

# RAM da maquina virtual
memory: 1024
