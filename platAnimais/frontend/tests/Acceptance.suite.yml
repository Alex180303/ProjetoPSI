# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Executa testes no navegador usando WebDriver ou PhpBrowser.
# Se precisar de testes com WebDriver e PHPBrowser, crie uma suite separada.
actor: AcceptanceTester
modules:
    enabled:
        - PhpBrowser:
            url: http://localhost
        - Yii2:
            part: orm
            entryScript: index-test.php
            cleanup: false
step_decorators: ~
