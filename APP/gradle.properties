# Definicoes Gradle para todo o projeto.
# Utilizadores de IDE (ex.: Android Studio):
# As definicoes do Gradle configuradas atraves do IDE *irao sobrepor*
# quaisquer definicoes especificadas neste ficheiro.
# Para mais detalhes sobre como configurar o ambiente de build, visite
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Especifica os argumentos JVM usados pelo processo daemon.
# Esta definicao e particularmente util para ajustar as definicoes de memoria.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Quando configurado, o Gradle sera executado em modo paralelo (incubating).
# Esta opcao deve ser usada apenas com projetos desacoplados. Para mais detalhes, visite
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Quando ativada, a cache de configuracao permite ao Gradle ignorar a fase de configuracao
# inteiramente se nada que afete a configuracao de build (como scripts de build)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true